# Model Information
# GFLOPs  Params.(M)
#  84.81    41.576
# Throughput (ins./s): 46.06739325463371 
seed: 1234
need_closs: True

model:
  NAME: CtwcSeg
  encoder_args:
    NAME: PointNext_CTWC_Encoder
    blocks: [1, 3, 5, 3, 3]
    strides: [1, 4, 4, 4, 4]
    sa_layers: 1
    sa_use_res: False 
    width: 32
    in_channels: 4
    expansion: 4
    radius: 0.1
    nsample: 32 
    aggr_args:
      feature_type: 'dp_fj'
      reduction: 'max'
    group_args:
      NAME: 'ballquery'
      normalize_dp: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: 'relu'
    norm_args:
      norm: 'bn'
  decoder_args:
    NAME: PointNext_CTWC_Decoder
  cls_args:
    NAME: SegHead
    num_classes: 13
    in_channels: null
    norm_args:
      norm: 'bn'
optimizer:
 NAME: 'adamw'  # performs 1 point better than adam
 weight_decay: 1.0e-4

# lr_scheduler:
sched: cosine
warmup_epochs: 2

min_lr: 1.0e-5 #
lr: 0.02 # LR linear rule.

batch_size: 8
